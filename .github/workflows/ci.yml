name: Validate and test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tools tests
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - run: pip-audit -r requirements.txt --strict
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra test
      - name: Prove policy rejects the bad fixture
        shell: bash
        run: |
          set +e
          python tools/azure_audit.py fixtures/azure_insecure.json --fail-on-high
          result=$?
          set -e
          test "$result" -eq 1
      - run: python tools/azure_audit.py fixtures/azure_secure.json --fail-on-high
